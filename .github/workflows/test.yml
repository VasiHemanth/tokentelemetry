name: Tests

# Why this exists: issue #65 — test files live on disk
# (backend/test_antigravity_cli.py, frontend/src/lib/navigation.test.ts) but no
# workflow ran them, so every PR merged with zero automated test coverage and
# the security-sensitive scanners had no regression gate. This runs those two
# scoped suites with dependency caching; widening beyond them is a separate
# decision once the workflow proves stable.

on:
  pull_request:
    paths:
      - "backend/**"
      - "frontend/src/**"
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - ".github/workflows/test.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/src/**"
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - ".github/workflows/test.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock

      # Same install line as backend/Dockerfile — hash-pinned lockfile,
      # so CI exercises the dependency set that actually ships.
      - name: Install backend dependencies
        run: pip install --require-hashes -r backend/requirements.lock

      # The file runs its own test_* functions under __main__ and exits nonzero
      # on failure — no pytest dependency to pin for it.
      - name: Run backend tests
        run: python backend/test_antigravity_cli.py

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install exact dependency tree from committed lockfile
        working-directory: frontend
        run: npm ci

      # `node --test` on the .ts file fails at ERR_MODULE_NOT_FOUND: the test's
      # relative imports carry no extension, which Node's ESM resolver refuses.
      # Compiling to CJS with the already-pinned typescript devDependency keeps
      # require()-style resolution and needs no new runtime dependency.
      - name: Compile the TS test to CJS
        working-directory: frontend
        run: npx tsc src/lib/navigation.test.ts --module commonjs --target es2020 --outDir .test-out --skipLibCheck --esModuleInterop

      - name: Run frontend tests
        working-directory: frontend
        run: node --test .test-out/navigation.test.js
