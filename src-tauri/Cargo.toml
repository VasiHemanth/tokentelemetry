[package]
name = "tokentelemetry-tray"
version = "0.1.0"
description = "TokenTelemetry menubar companion"
authors = ["Hemanth Vasi"]
license = "MIT"
repository = "https://github.com/VasiHemanth/tokentelemetry"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.11", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-opener = "2.5"
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2.5"
tauri-plugin-single-instance = "2.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dirs = "6"
tokio = { version = "1", features = ["time", "rt"] }

# TLS is deliberately disabled. This client only ever talks to 127.0.0.1, and
# building without TLS makes an accidental outbound HTTPS call impossible
# rather than merely discouraged (the project is local-first by policy).
reqwest = { version = "0.12", default-features = false, features = ["json"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
